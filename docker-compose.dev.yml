services:
  opensrm:
    build:
      context: .
    image: opensrm:dev
    volumes:
      - ./app:/app/app
    environment:
      - LOG_LEVEL=DEBUG
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - gunicorn
      - --reload
      - -w
      - "1"
      - --threads
      - "8"
      - -t
      - "120"
      - --worker-class
      - gthread
      - -b
      - 0.0.0.0:8080
      - app.app:app
