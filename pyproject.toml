[project]
name = "opensrm"
version = "3.0.0"
description = "Self-hosted attendance dashboard for the SRM Student Portal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "ddddocr==1.6.1",
    "gunicorn==27.0.0",
    "cryptography>=50.0.1",
    "pywebpush==2.5.0",
]

# The archived Playwright fallback (README "Playwright fallback (archived)"):
# runtime-off unless PLAYWRIGHT_FALLBACK=enabled, and not in the shipped image
# unless built with --build-arg WITH_PLAYWRIGHT=1. Dev DUTs and the CI e2e job
# install it with: uv sync --extra browser
[project.optional-dependencies]
browser = ["playwright==1.65.1"]

# Dev tooling that CI gates on. These live in the lockfile on purpose: `uvx
# ruff` resolves the newest release on every run, so an unrelated ruff bump
# could turn main red with no code change. Versions are exact.
[dependency-groups]
dev = [
    "ruff==0.17.4",
    "pip-audit==2.10.1",
    "actionlint-py==1.7.12.25",
]

[project.scripts]
