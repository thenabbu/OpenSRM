name: Release

# Every version that lands on main gets a tag and a GitHub Release, its body
# generated from the commits in that range (scripts/release_notes.py). The app
# itself carries no release-notes feed any more - GitHub Releases IS the
# changelog, so this job is the only thing that can produce one, and a failed
# run is loud instead of silent.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill:
        description: "Walk history and create tags/Releases for every past VERSION change"
        type: boolean
        default: false

permissions:
  contents: read

# Two pushes landing together each try `gh release create` for the same tag and
# then both push CHANGELOG.md; serialise instead of racing on non-fast-forward.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the generator needs full history + tags
          # persist-credentials stays ON here (zizmor finding accepted): the
          # CHANGELOG step below pushes back to main with this token. Every
          # other workflow sets it false.

      - name: Did this push change VERSION?
        id: gate
        run: |
          set -eu
          # The CHANGELOG step below commits back to main, which triggers this
          # workflow again. Without this gate that second run adds another
          # changelog commit (two per release, polluting the next range), so we
          # only proceed when VERSION actually moved.
          if git rev-parse -q --verify HEAD~1 >/dev/null \
             && [ "$(git show HEAD~1:VERSION 2>/dev/null | tr -d '[:space:]')" \
                = "$(tr -d '[:space:]' < VERSION)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "VERSION unchanged in this push - nothing to release"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve VERSION and previous release
        id: v
        if: steps.gate.outputs.changed == 'true'
        run: |
          set -eu
          VERSION="$(cat VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # highest semver tag that is NOT the current version
          PREV="$(git tag -l 'v*' | sort -V | grep -vx "v$VERSION" | tail -1 || true)"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION PREV=${PREV:-<none>}"

      - name: Generate notes
        if: steps.gate.outputs.changed == 'true'
        id: notes
        run: |
          set -eu
          V="v${{ steps.v.outputs.version }}"
          if [ -n "${{ steps.v.outputs.prev }}" ]; then
            python3 scripts/release_notes.py --from "${{ steps.v.outputs.prev }}" \
              --to "$GITHUB_SHA" --title "$V" --out /tmp/notes.md
          else
            printf '## %s\n\n_First tracked release._\n' "$V" > /tmp/notes.md
          fi
          # An empty body means the generator broke - fail loudly, never publish it.
          test -s /tmp/notes.md
          echo "---- generated ----"; cat /tmp/notes.md

      - name: Create tag and Release
        if: steps.gate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          V="v${{ steps.v.outputs.version }}"
          if gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $V already exists - leaving it alone"
          else
            gh release create "$V" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$V" --notes-file /tmp/notes.md
            echo "created $V"
          fi
          gh release view "$V" --repo "$GITHUB_REPOSITORY" --json tagName,url \
            --jq '"published: \(.tagName) \(.url)"' # shellcheck disable=SC2016 — jq, not bash

      - name: Regenerate CHANGELOG.md from Releases
        if: steps.gate.outputs.changed == 'true'
        run: |
          set -eu
          # Rebuild the whole file from the published Releases instead of
          # splicing. Splicing needed the preamble offset to stay in sync and
          # silently dropped the version heading when it drifted; a rebuild is
          # idempotent by construction and cannot gain duplicate sections.
          # ponytail: paginated at 100 releases; page if the repo ever passes it.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,publishedAt --jq '.[] | .tagName' \
            | sort -V -r > /tmp/tags.txt
          {
            printf '# Changelog\n\n'
            printf 'Generated from git history by `scripts/release_notes.py`. Every GitHub Release body is the same rendering.\n'
            while read -r tag; do
              [ -n "$tag" ] || continue
              printf '\n'
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body
            done < /tmp/tags.txt
          } > CHANGELOG.md
          if git diff --quiet CHANGELOG.md; then echo "CHANGELOG already current"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): ${{ steps.v.outputs.version }}"
          git push origin HEAD:main
