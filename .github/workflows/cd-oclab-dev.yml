name: Deploy dev (automatic)

# Staging at srm-dev.200871.xyz. Separate file from cd-oclab.yml on purpose: the
# prod deploy must never be reachable from a dev build, and a single workflow
# filtered on branch would put both paths one bad `if:` apart.
on:
  workflow_run:
    workflows: ["Build & Push"]
    types: [completed]
    # This filter matches the TRIGGERING RUN's head branch, not a PR base.
    branches: [dev]
  workflow_dispatch:
    inputs:
      sha:
        description: "short sha already published as ghcr.io/thenabbu/opensrm:dev-<sha>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-dev
  # A superseded staging build has no rollback value, unlike prod.
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: https://srm-dev.200871.xyz
    steps:
      - name: Check the dev target is provisioned
        env:
          OCLAB_HOST: ${{ vars.OCLAB_HOST }}
          OCLAB_SSH: ${{ secrets.OCLAB_DEPLOY_SSH }}
        run: |
          set -eu
          missing=0
          if [ -z "${OCLAB_HOST:-}" ]; then
            echo "::error::variable OCLAB_HOST is not set"; missing=1
          fi
          if [ -z "${OCLAB_SSH:-}" ]; then
            echo "::error::secret OCLAB_DEPLOY_SSH is not set"; missing=1
          fi
          [ "$missing" = 0 ] || exit 1

      - name: Resolve the build to deploy
        id: ref
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ inputs.sha }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="$DISPATCH_SHA"
          else
            SHA="$(printf '%s' "$RUN_SHA" | cut -c1-7)"
          fi
          case "$SHA" in
            *[!0-9a-f]*) echo "::error::'$SHA' is not a hex sha"; exit 1 ;;
          esac
          [ "${#SHA}" -ge 7 ] || { echo "::error::'$SHA' is too short to be a sha"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "deploying ghcr.io/thenabbu/opensrm:dev-$SHA"

      # Refuse to run for a build that was NOT a dev build. A workflow_dispatch
      # skips the `branches:` filter above, so this is the only guard left.
      - name: Refuse to act on a run that was not a dev build
        if: github.event_name == 'workflow_run'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          [ "$BRANCH" = "dev" ] || { echo "::error::triggered by a '$BRANCH' build, not dev"; exit 1; }

      - name: Deploy the dev service only
        env:
          OCLAB_HOST: ${{ vars.OCLAB_HOST }}
          OCLAB_DEPLOY_SSH: ${{ secrets.OCLAB_DEPLOY_SSH }}
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -eu
          KEY="$(mktemp)"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$OCLAB_DEPLOY_SSH" > "$KEY"
          chmod 600 "$KEY"
          # The verb takes ONE argument and recreates ONLY the opensrm-dev
          # service. A bare `docker compose up -d` would reconcile the whole
          # project and recreate PROD from OPENSRM_TAG - they share one compose
          # file and one .env on that box.
          ssh -i "$KEY" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "ubuntu@$OCLAB_HOST" "deploy-dev $SHA"

      # The old probe curled the PUBLIC URL from the runner. Cloudflare answers a
      # GitHub runner with 403 (every attempt, both deploys on 2026-11-26), so the
      # job went red on a deploy that had in fact recreated the container and was
      # serving the new bundle. Ask the box instead: the container's own
      # HEALTHCHECK is the same /healthz, and comparing the running image id with
      # `:dev-<sha>` proves the deploy shipped THIS build, not the previous one.
      - name: Verify staging runs this build
        env:
          OCLAB_HOST: ${{ vars.OCLAB_HOST }}
          OCLAB_DEPLOY_SSH: ${{ secrets.OCLAB_DEPLOY_SSH }}
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -eu
          KEY="$(mktemp)"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$OCLAB_DEPLOY_SSH" > "$KEY"
          chmod 600 "$KEY"
          for i in $(seq 1 24); do
            OUT="$(ssh -i "$KEY" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "ubuntu@$OCLAB_HOST" \
              "docker inspect --format '{{.State.Health.Status}} {{.Image}}' opensrm-dev; docker image inspect --format '{{.Id}}' ghcr.io/thenabbu/opensrm:dev-$SHA" || true)"
            HEALTH="$(printf '%s\n' "$OUT" | sed -n 1p | awk '{print $1}')"
            RUNNING="$(printf '%s\n' "$OUT" | sed -n 1p | awk '{print $2}')"
            WANT="$(printf '%s\n' "$OUT" | sed -n 2p)"
            if [ "$HEALTH" = "healthy" ] && [ -n "$WANT" ] && [ "$RUNNING" = "$WANT" ]; then
              echo "staging runs dev-$SHA, healthy after $i attempt(s)"
              exit 0
            fi
            echo "attempt $i: health=$HEALTH running=$RUNNING want=$WANT"
            sleep 5
          done
          echo "::error::staging never ran dev-$SHA healthy (see the attempts above)"
          exit 1
