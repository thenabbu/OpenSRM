# Supply-chain scans — BLOCKING.
#
# All three jobs gate the merge. The baseline was clean on the day they were
# flipped (gitleaks full history, pip-audit on the locked export, trivy
# HIGH/CRITICAL with a fix available), so blocking cost nothing then; from
# here a new finding is a red check rather than a line in a summary nobody
# opens. docs/SCANS.md keeps the per-job "what this gates" notes.
#
# Flipping one back to report-only is a maintainer decision, not a fix: delete
# the `continue-on-error` guard on that job ONLY, and say why in the PR.
name: Scans

on:
  # Same branch scoping as tests.yml: feat/preact-migration is the long-lived
  # branch this wave's PRs land on, and without it listed here none of these
  # scans run on that branch at all — the scans would exist and never execute.
  # Drop the branch entry when the migration merges to main.
  pull_request:
    branches: [main, feat/preact-migration]
  push:
    branches: [main, feat/preact-migration]
  workflow_dispatch:

# audit: scans only read the repo; the trivy build context never leaves the
# runner and nothing is pushed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks (secrets in history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history — leaks only matter if they are old
      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # gitleaks-action reports via annotations only - mirror the finding count
      # into the job summary so the report-only contract is visible per job.
      - name: Job summary
        if: always()
        run: |
          {
            echo "### gitleaks (full history)"
            echo
            echo "gitleaks-action reports findings as PR annotations; no"
            echo "summary table is produced when the scan is clean."
          } >> "$GITHUB_STEP_SUMMARY"


  deps:
    name: pip-audit (python deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync dev tools (locked)
        run: uv sync --locked --group dev

      # pip cannot resolve a git+ requirement for hashing, so the pinned-git
      # blobatar line (a commit-pinned supply-chain item covered by the
      # Dockerfile digest pins + trivy image scan + test_audit_findings M22) is dropped
      # from the export before auditing; everything else is audited.
      - name: Export locked requirements
        run: |
          uv export --frozen --no-dev | grep -v 'git+' > requirements-audit.txt
          echo "requirements: $(grep -c '==' requirements-audit.txt) pinned lines"

      - name: Audit python dependencies (OSV)
        run: |
          # pip-audit exits non-zero WHEN IT FINDS VULNERABILITIES. Under the
          # runner's `bash -e` an unguarded call therefore killed this step at
          # the exact moment there was something to report. `|| true` is on
          # both calls on purpose; the Python block below is the reporter and
          # its own exit code is what this step means.
          uv run --locked pip-audit -r requirements-audit.txt --format markdown -o pip-audit.md || true
          uv run --locked pip-audit -r requirements-audit.txt --format json -o pip-audit.json || true
          python3 - <<'PY'
          import json, os, pathlib
          deps = json.load(open("pip-audit.json"))["dependencies"]
          vulns = {d["name"]: d["vulns"] for d in deps if d["vulns"]}
          md = pathlib.Path("pip-audit.md")
          total = sum(len(v) for v in vulns.values())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"\n\npip-audit: {len(deps)} dependencies audited, "
                     f"{total} known vulnerabilities\n")
              if md.exists():
                  f.write("\n\n" + md.read_text())
          # Blocking gate: the reporter's own exit code is what the step means.
          # pip-audit exits 0 when it only LISTED findings and its exit code is
          # swallowed by `|| true` above, so the failure has to be raised here
          # or the job goes green with a vulnerability in it.
          if total:
              raise SystemExit(f"pip-audit: {total} known vulnerabilit(y/ies) - see the summary above")
          PY

  web-deps:
    # The `deps` job audits what runs on the server; this one audits what builds
    # web/. Only preact/dexie/zod reach the browser inside dist/ — the rest is
    # build-time tooling that never enters the image — but a compromised build
    # chain is a supply-chain finding too, so it gates the merge like its
    # siblings.
    name: pnpm audit (web deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Same Node + pnpm pin as tests.yml job `web`. Two pins that disagree
      # would audit a resolution the build never produces.
      - name: Set up Node 22
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      # No install step on purpose: pnpm audit resolves advisories from
      # web/pnpm-lock.yaml, so this job never executes a dependency's
      # postinstall script on the runner.
      #
      # pnpm audit exits non-zero WHEN IT FINDS ANYTHING (down to low), which
      # under the runner's `bash -e` killed this step at the exact moment there
      # was something to report — the same trap the pip-audit job above hit.
      # `|| true` is deliberate; the reporter below owns the exit code.
      - name: Audit web dependencies
        run: |
          pnpm -C web audit --json > pnpm-audit.json || true
          python3 - <<'PY'
          import json, os, sys

          # Accepted HIGH/CRITICAL, one GHSA per line, each justified in
          # notes/DECISION-w8.2-supply-chain.md. An entry here is a finding the
          # maintainer looked at and could not fix — never a finding nobody read.
          ACCEPTED = {
              # picomatch ReDoS: the registry's newest release (4.0.7) IS the
              # vulnerable one, so no upgrade exists; build-only (vite's globber).
              "GHSA-fc5q-39xc-vjpf",
          }

          try:
              adv = json.load(open("pnpm-audit.json")).get("advisories") or {}
          except Exception as e:
              # A missing/unparseable report means the audit did not run (no
              # registry, bad lockfile). Silence there is a green check over an
              # unaudited tree, which is worse than red.
              sys.exit(f"pnpm-audit: unusable report ({e}) - the audit did not run")

          gate = ("high", "critical")
          hits = [a for a in adv.values() if a.get("severity") in gate]
          blocking = [a for a in hits if a.get("github_advisory_id") not in ACCEPTED]
          accepted = [a for a in hits if a.get("github_advisory_id") in ACCEPTED]
          gone = ACCEPTED - {a.get("github_advisory_id") for a in adv.values()}

          lines = [f"pnpm-audit: {len(hits)} HIGH/CRITICAL advisor(y/ies) in "
                   f"{len(adv)} total, {len(accepted)} accepted"]
          for a in sorted(hits, key=lambda x: x["severity"] + x["module_name"]):
              lines.append(f"- **{a['severity'].upper()}** {a['module_name']} "
                           f"`{a.get('vulnerable_versions','')}` "
                           f"{a['github_advisory_id']} — {a['title']}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n\n### pnpm audit (web/)\n\n" + "\n".join(lines) + "\n")

          # Also on stdout, not only in the job summary: "no unaccepted
          # HIGH/CRITICAL" alone cannot tell "audited clean" from "audited
          # nothing", and the summary is not in the log a reader greps.
          print(lines[0])
          if gone:
              # Not a failure: the forcing function is a human reading it.
              print("pnpm-audit: allowlist entry no longer reported, drop it:", sorted(gone))
          if blocking:
              sys.exit("pnpm-audit: %d unaccepted HIGH/CRITICAL - %s"
                       % (len(blocking), [a["github_advisory_id"] for a in blocking]))
          print("pnpm-audit: no unaccepted HIGH/CRITICAL")
          PY

  image:
    name: trivy (built image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Same image CI ships (build.yml), never pushed from here.
      - name: Build image (never pushed)
        run: DOCKER_BUILDKIT=1 docker build -t opensrm:scan .

      - name: Trivy HIGH/CRITICAL with a fix available
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opensrm:scan
          format: table
          exit-code: 1 # blocking: a fixable HIGH/CRITICAL CVE fails the merge
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          output: trivy.txt

      # `if: always()` because trivy now exits 1 on a finding: without it the
      # action fails first and the table explaining WHY never renders, leaving
      # a red check with no CVE in the log (it read exactly that way the day
      # blocking was switched on).
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Trivy — HIGH/CRITICAL with a fix available"
            echo
            if [ -s trivy.txt ]; then
              echo '```'
              tail -n +1 trivy.txt
              echo '```'
            else
              echo "No findings above the threshold (or the scan did not run —"
              echo "check the step above)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
