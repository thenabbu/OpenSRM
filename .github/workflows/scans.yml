# Supply-chain scans — BLOCKING.
#
# All three jobs gate the merge. The baseline was clean on the day they were
# flipped (gitleaks full history, pip-audit on the locked export, trivy
# HIGH/CRITICAL with a fix available), so blocking cost nothing then; from
# here a new finding is a red check rather than a line in a summary nobody
# opens. docs/SCANS.md keeps the per-job "what this gates" notes.
#
# Flipping one back to report-only is a maintainer decision, not a fix: delete
# the `continue-on-error` guard on that job ONLY, and say why in the PR.
name: Scans

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# audit: scans only read the repo; the trivy build context never leaves the
# runner and nothing is pushed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks (secrets in history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history — leaks only matter if they are old
      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # gitleaks-action reports via annotations only - mirror the finding count
      # into the job summary so the report-only contract is visible per job.
      - name: Job summary
        if: always()
        run: |
          {
            echo "### gitleaks (full history)"
            echo
            echo "gitleaks-action reports findings as PR annotations; no"
            echo "summary table is produced when the scan is clean."
          } >> "$GITHUB_STEP_SUMMARY"


  deps:
    name: pip-audit (python deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync dev tools (locked)
        run: uv sync --locked --group dev

      # pip cannot resolve a git+ requirement for hashing, so the pinned-git
      # blobatar line (a commit-pinned supply-chain item covered by the
      # Dockerfile digest pins + trivy image scan + test_audit_findings M22) is dropped
      # from the export before auditing; everything else is audited.
      - name: Export locked requirements
        run: |
          uv export --frozen --no-dev | grep -v 'git+' > requirements-audit.txt
          echo "requirements: $(grep -c '==' requirements-audit.txt) pinned lines"

      - name: Audit python dependencies (OSV)
        run: |
          # pip-audit exits non-zero WHEN IT FINDS VULNERABILITIES. Under the
          # runner's `bash -e` an unguarded call therefore killed this step at
          # the exact moment there was something to report. `|| true` is on
          # both calls on purpose; the Python block below is the reporter and
          # its own exit code is what this step means.
          uv run --locked pip-audit -r requirements-audit.txt --format markdown -o pip-audit.md || true
          uv run --locked pip-audit -r requirements-audit.txt --format json -o pip-audit.json || true
          python3 - <<'PY'
          import json, os, pathlib
          deps = json.load(open("pip-audit.json"))["dependencies"]
          vulns = {d["name"]: d["vulns"] for d in deps if d["vulns"]}
          md = pathlib.Path("pip-audit.md")
          total = sum(len(v) for v in vulns.values())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"\n\npip-audit: {len(deps)} dependencies audited, "
                     f"{total} known vulnerabilities\n")
              if md.exists():
                  f.write("\n\n" + md.read_text())
          # Blocking gate: the reporter's own exit code is what the step means.
          # pip-audit exits 0 when it only LISTED findings and its exit code is
          # swallowed by `|| true` above, so the failure has to be raised here
          # or the job goes green with a vulnerability in it.
          if total:
              raise SystemExit(f"pip-audit: {total} known vulnerabilit(y/ies) - see the summary above")
          PY

  image:
    name: trivy (built image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Same image CI ships (build.yml), never pushed from here.
      - name: Build image (never pushed)
        run: DOCKER_BUILDKIT=1 docker build -t opensrm:scan .

      - name: Trivy HIGH/CRITICAL with a fix available
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opensrm:scan
          format: table
          exit-code: 1 # blocking: a fixable HIGH/CRITICAL CVE fails the merge
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          output: trivy.txt

      - name: Job summary
        run: |
          {
            echo "### Trivy — HIGH/CRITICAL with a fix available"
            echo
            echo '```'
            tail -n +1 trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
