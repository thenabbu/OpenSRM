name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# audit: default token read-only for this workflow
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run ruff
        run: uvx ruff check app/

      - name: Lockfile freshness
        run: uv lock --check
