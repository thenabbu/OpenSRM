name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# audit: default token read-only for this workflow
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # zizmor: the token is not needed after checkout; leaving it in
          # .git/config lets any step (or a poisoned action) push.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run ruff
        run: uvx ruff check app/

      # actionlint catches what YAML parsers cannot: duplicated keys that a
      # loader silently keeps last (a second `with:` swallowed a fetch-depth),
      # bad expression syntax, and shellcheck-grade mistakes in run: blocks.
      # It found a real one the day it was added.
      - name: Workflow syntax (actionlint)
        run: |
          uvx --from actionlint-py actionlint

      - name: Lockfile freshness
        run: uv lock --check

      # app.css is committed (DESIGN §10.1): rebuild it and fail if the
      # result differs — a stale committed file can never ship. Downloads
      # the pinned toolchain (~110 MB) into the runner's cache dir.
      - name: Compiled CSS is current (build-css.sh + git diff)
        run: |
          bash scripts/build-css.sh
          git diff --exit-code app/static/app.css
