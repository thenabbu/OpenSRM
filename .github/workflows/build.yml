name: Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      republish:
        description: "Republish :latest + :<VERSION> at the current commit (no VERSION move)"
        type: boolean
        default: false

# audit: default token is read-only; build job opts into packages:write itself
permissions:
  contents: read

# A manual dispatch from a feature branch could otherwise publish :latest
# from code that never passed the main-push gates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The project's own suites (unit / docker / e2e), reused so `build` can gate
  # on them: a red suite must never push :latest. Same file drives the PR runs.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: [tests]
    # A manual dispatch from any other branch must not publish :latest.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # HEAD~1 is the pre-push main tip and the ONLY baseline for the
          # VERSION gate. At the default depth of 1 that commit is absent, the
          # comparison silently falls back to "moved", and every push then
          # republishes :<VERSION> + :latest as a fresh digest - measured on
          # run 43529620376: `VERSION moved (<none> -> 2.12.0)` on a push that
          # did not change VERSION at all.
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The VERSION file is the single source of release truth (app badge +
      # pyproject + uv.lock all mirror it) - tag the image with it too so a
      # deploy can pin/roll back: ghcr.io/thenabbu/opensrm:<VERSION>.
      - name: Read VERSION
        id: version
        run: |
          set -eu
          V="$(cat VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Did THIS push move VERSION? Compare against HEAD~1, the pre-push main
          # tip: a multi-commit push would hide an earlier bump in a diff, and
          # github.event.before is empty on a workflow_dispatch.
          #
          # Only a real bump may push :<VERSION> and :latest. Re-publishing them
          # on every docs commit makes :2.12.0 a moving target and destroys the
          # rollback point the tag exists for.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A dispatch is a build check by default; republishing a version is
            # an explicit request, never a side effect.
            RELEASED="${{ inputs.republish }}"
            echo "dispatch: republish=${RELEASED} (VERSION $V)"
          elif git rev-parse -q --verify HEAD~1 >/dev/null \
               && [ -n "$(git show HEAD~1:VERSION 2>/dev/null | tr -d '[:space:]')" ]; then
            MOVED="$(git show HEAD~1:VERSION | tr -d '[:space:]')"
            if [ "$MOVED" != "$V" ]; then
              RELEASED=true
              echo "VERSION moved ($MOVED -> $V): :$V and :latest will move"
            else
              RELEASED=false
              echo "VERSION unchanged ($V): nothing is published"
            fi
          else
            # First push on a repo with no parent, or a shallow clone again:
            # publishing is the safe side, but say so instead of guessing.
            RELEASED=true
            echo "::warning::no HEAD~1 to compare VERSION against - treating this push as a release"
          fi
          echo "released=$RELEASED" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/thenabbu/opensrm
          # :latest then :VERSION, and NOTHING else. A sha tag made GHCR name
          # every package version after the commit (`a9c2598`), and because a tag
          # is unique per digest the old entries kept only their sha - the page
          # read like random words. GHCR names a version after a tag it carries,
          # so :VERSION goes LAST; it is the name a human reads.
          # The exact commit is not lost: it is the OCI revision label below and
          # the provenance attestation, and any version is pinnable via :VERSION.
          tags: |
            type=raw,value=latest,enable=${{ steps.version.outputs.released == 'true' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.released == 'true' }}
          # metadata-action derives org.opencontainers.image.version from the
          # highest-priority tag (latest) - pin the real release number and
          # the exact commit on the label instead, so `docker inspect` names
          # the release even on the latest-labeled image.
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          # An unreleased commit publishes nothing: no sha-named package version
          # to clutter the registry. The build still runs, so a broken
          # Dockerfile is caught on the merge rather than at release time.
          push: ${{ steps.version.outputs.released == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
