name: Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch:

# audit: default token is read-only; build job opts into packages:write itself
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run ruff
        run: uvx ruff check app/

      - name: Lockfile freshness
        run: uv lock --check

  # The project's own suites (unit / docker / e2e), reused so `build` can gate
  # on them: a red suite must never push :latest. Same file drives the PR runs.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The VERSION file is the single source of release truth (app badge +
      # pyproject + uv.lock all mirror it) - tag the image with it too so a
      # deploy can pin/roll back: ghcr.io/thenabbu/opensrm:<VERSION>.
      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/thenabbu/opensrm
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=
          # metadata-action derives org.opencontainers.image.version from the
          # highest-priority tag (latest) - pin the real release number and
          # the exact commit on the label instead, so `docker inspect` names
          # the release even on the latest-labeled image.
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
