# PR test gate: the project's own suites, not just ruff.
#
# unit  — every suite that needs no server and no network (AGENTS.md matrix,
#         verified by running each on a clean clone with a fresh DATA_DIR).
# docker — image built but NOT pushed; booted by `docker compose` against the
#         real compose file (prod hardening + healthcheck) on an empty volume,
#         proving an authenticated dashboard renders (login-only smoke misses
#         500s).
# e2e   — the Playwright suites: self-booting ones plus those that need a
#         server (one gunicorn behind them, guarded by require_own_server).
#
# test_login_guide_server is deliberately absent: it performs 7 REAL portal logins per
# run and the portal caps 10/hour/IP. test_login_guide_check IS included — it mocks
# /api/login in the browser, so nothing reaches the portal.
#
# Called from build.yml as a reusable workflow so the :latest publish can
# `needs` a green test run on main.
name: Tests

on:
  # No bare `push:` on main on purpose. On main this workflow runs ONLY as the
  # reusable job Build & Push gates on; a second standalone copy on the same
  # push was pure duplication.
  #
  # feat/preact-migration is the one exception: a long-lived branch that is not
  # merging to main yet, so without this trigger its browser gates never run at
  # all on push (a PR to main is what would otherwise carry them).
  push:
    branches: [feat/preact-migration]
  pull_request:
    branches: [main]
  workflow_call:

# audit: default token read-only for this workflow
permissions:
  contents: read

concurrency:
  # Distinct from Build & Push's group on purpose. Both run on a main push, and
  # a shared group with cancel-in-progress lets one kill the other - observed
  # as "build: skipped" with no tests job at all in the Build & Push run.
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # zizmor: nothing after checkout needs the token in .git/config.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Keyed on uv.lock (+ restore-keys fallback) by the action itself;
          # the hand-rolled actions/cache step had no restore-keys, so any
          # lockfile change was a cold cache every run.
          enable-cache: true

      - name: Sync dependencies (frozen lockfile, browser extra for the fallback tests)
        run: uv sync --frozen --extra browser

      # Each suite is its own step so a red one names itself in the checks UI.
      # DATA_DIR is inline per step: a fresh empty dir, so migrations run at
      # import and the suite seeds its own state.
      - name: test_audit_findings (static checks)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_audit_findings.py
      - name: check_architecture (app-module import DAG + app.py ratchet)
        run: PYTHONPATH=. .venv/bin/python scripts/check_architecture.py
      # gates.sh has always run this, so the local bar could go red while CI
      # stayed green on the exact same tree.
      - name: check_docs (docs must not contradict the code)
        run: PYTHONPATH=. .venv/bin/python scripts/check_docs.py
      # Phase 2.3. Runs here as well as in gates.sh: the dist CSS is committed,
      # so a rebuild that drops selectors or leaves a stale app-*.css hash
      # behind must go red on the PR, not only on someone's laptop.
      - name: css_parity (Vite CSS == committed app.css, one app-*.css in dist)
        run: PYTHONPATH=. .venv/bin/python scripts/css_parity.py
      - name: test_app_factory (create_app isolation)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_app_factory.py
      - name: test_exams (end-sem parser)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_exams.py
      - name: test_exams_view (exam card view model)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_exams_view.py
      - name: test_tt_history (timetable edit log)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_tt_history.py
      - name: test_tt_hero (hero attendance join passthrough)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_tt_hero.py
      - name: test_relogin_save (mid-scrape relogin)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_relogin_save.py
      - name: test_fernet_rotation (FERNET_KEYS MultiFernet + rotate script)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_fernet_rotation.py
      - name: test_official_tt (portal formId-10 parser + contract)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_official_tt.py
      - name: test_assets_dist_url (dist entry must equal the URL its chunks import)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_assets_dist_url.py
      - name: test_offline_shell (offline shell carries structure but no PII)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_offline_shell.py
      - name: test_logout_wipes_caches (logout clears every cache, not just CACHE_NAME)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_logout_wipes_caches.py
      - name: test_sessions (session lifecycle contract)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_sessions.py
      - name: test_account_delete (schema-driven account-deletion residue)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_account_delete.py
      - name: test_login_reject (rejection classifier + quotas)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_login_reject.py
      - name: test_state_classes (rate/progress/portal-health locks + pruning)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_state_classes.py
      - name: test_fault_handling (corrupt-row degradation)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_fault_handling.py
      - name: test_logging_telemetry (ntfy/rotation/scrub)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_logging_telemetry.py
      - name: test_metrics (observability counters + /internal/metrics auth)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_metrics.py
      - name: test_observability_assets (ops stack guard rails)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_observability_assets.py
      - name: test_sync_cache (refresh cache window + per-netid single flight)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_sync_cache.py
      - name: test_sync_queue (bounded wait + priority + budget buckets)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_sync_queue.py
      - name: test_canary_sync (canary_sync.sh end-to-end)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_canary_sync.py
      - name: test_marks_view (marks view model)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_marks_view.py
      - name: test_layout (card/widget engine)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_layout.py
      - name: test_css_safelist (render-time classes exist in app.css)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_css_safelist.py
      - name: test_perf_budget (third-party-free pages, cache headers, reload sites)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_perf_budget.py
      - name: test_attendance_view (attendance view model)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_attendance_view.py
      - name: test_att_firstpaint (no stale Absences card during a scope sync)
        run: PYTHONPATH=. DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_att_firstpaint.py
      - name: test_feedback (harvester + opt-in plan)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_feedback.py
      - name: test_push_calc (due window + blocks)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_push_calc.py
      - name: test_push_store (claims + at-most-once)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_push_store.py
      - name: test_push_send (mocked pywebpush)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_push_send.py
      - name: test_push_tick (tick auth + allowlist)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_push_tick.py
      - name: test_push_api (push REST endpoints)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_push_api.py
      - name: test_login_guide_static (login flow, source level)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_login_guide_static.py
      - name: test_supply_chain (image tags + scan workflow pins)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_supply_chain.py
      - name: healthz
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_healthz.py
      - name: test_db_concurrency (db() lock timeout + journal mode)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_db_concurrency.py
      - name: test_db_layer (request-scoped connection + transaction isolation)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_db_layer.py
      - name: test_cross_site_guard (cross-site POST refused, same-origin allowed)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_cross_site_guard.py
      - name: test_route_auth (every non-public route refuses anonymous)
        run: PYTHONPATH=. DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_route_auth.py
      - name: test_comment_balance (no orphaned CSS comment)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_comment_balance.py
      - name: test_auto_sync (dashboard refreshes stale portal data)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_auto_sync.py
      - name: test_product_analytics (visit beacon + analytics recording)
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_product_analytics.py
      - name: test_scope_client (SCOPE wire, toggles, m018, cold sync, Tools gate)
        run: PYTHONPATH=. DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_scope_client.py
      - name: test_scope_academics (Academics tab, CGPA math + feature gate)
        run: PYTHONPATH=. DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_scope_academics.py
      # These four suites existed and passed but were never wired into CI
      # (found by an independent docs/gate review). Each needs PYTHONPATH=.
      - name: test_hourwise_join (hourwise rows joined to the timetable)
        run: PYTHONPATH=. DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_hourwise_join.py
      - name: test_scope_campus (SCOPE campus tab + alive-empty fixtures)
        run: PYTHONPATH=. DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_scope_campus.py
      - name: test_scope_fees (SCOPE fees ledger + dues math)
        run: PYTHONPATH=. DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_scope_fees.py
      - name: test_scope_profile (SCOPE profile enrichment + Settings merge)
        run: PYTHONPATH=. DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_scope_profile.py
      - name: test_readpath_netid (P7.1 offline read path — data-netid is the cache key)
        run: PYTHONPATH=. DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_readpath_netid.py
      # P10.1 rollback flag: PREACT_ISLANDS unset must still hydrate (default
      # ON), and off must degrade to server-rendered panels, not a 500.
      - name: test_rollback_flag (PREACT_ISLANDS gates only the island tag)
        run: PYTHONPATH=. DATA_DIR="$(mktemp -d)" .venv/bin/python tests/unit/test_rollback_flag.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # zizmor: nothing after checkout needs the token in .git/config.
          persist-credentials: false

      # The Dockerfile uses `RUN --mount=type=cache`, which needs BuildKit.
      # The default docker driver (not buildx's container driver) is used on
      # purpose: it loads the built image into the daemon so the next step can
      # `docker run` it without a separate --load.
      - name: Build image (never pushed from here)
        run: DOCKER_BUILDKIT=1 docker build -t opensrm:ci .

      # Empty volume -> fresh DB -> migrations at import -> seeded fabricated
      # user -> minted cookie -> authenticated GET / must be 200 with the
      # seeded literal on the page.
      - name: Boot on empty volume + authenticated render smoke
        run: bash scripts/ci_docker_smoke.sh

      # Upgrade path: the smoke above only ever proves a FRESH install. Every
      # real deploy carries the previous release's data, and a migration that
      # only works on an empty DB is the failure that reaches prod and takes
      # the dashboard down. Boots the oldest still-published release on this
      # volume, then this image on the same one.
      - name: Log in to GHCR (read the previous release)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade smoke (previous release's data under this image)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -eu
          # Walk releases newest-first and take the first one that has an image
          # in GHCR. Older releases predate image publishing (v1.3.0 exists as a
          # tag with no image), so "the previous release" has to mean "the
          # previous release we can actually boot", not releases[0] blindly.
          TAGS=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | python3 -c "import json,sys;[print(r['tag_name'].lstrip('v')) for r in json.load(sys.stdin)]")
          [ -n "$TAGS" ] || { echo "::error::no releases found"; exit 1; }
          CUR=$(cat VERSION)
          OLD=""
          for t in $TAGS; do
            # Skip the release this tree already IS (it may be tagged but not
            # yet re-built) - upgrading 2.11.0 to 2.11.0 tests nothing.
            [ "$t" = "$CUR" ] && { echo "  $t is the current VERSION, skipping"; continue; }
            if docker pull "ghcr.io/thenabbu/opensrm:$t" >/dev/null 2>&1; then OLD="$t"; break; fi
            echo "  $t has no pullable image, trying the next one"
          done
          [ -n "$OLD" ] || { echo "::error::no release with a pullable image - the upgrade path is untested"; exit 1; }
          echo "upgrade smoke against: $OLD"
          OLD_IMAGE="ghcr.io/thenabbu/opensrm:$OLD" NEW_IMAGE=opensrm:ci \
            bash scripts/ci_upgrade_smoke.sh

      # The old smoke only greps the netid on /, which passes even when every
      # data-gated panel is empty - the exact hole that let a SCOPE integration
      # ship "green" while the browser showed nothing. This asserts the chain:
      # feature on -> stored data -> Tools row -> target panel in the DOM ->
      # seeded content rendered.
      - name: SCOPE surfaces actually render (panels + Tools links)
        run: |
          NAME=osrm-scope-ci
          trap 'docker rm -f $NAME >/dev/null 2>&1 || true' EXIT
          docker run -d --name $NAME -e SCOPE_FEATURES=all opensrm:ci >/dev/null
          # ponytail: retry counter is unused by design; _ keeps shellcheck quiet
          # without a disable comment swallowing future real findings.
          for _ in $(seq 1 60); do
            docker exec $NAME python -c "import app.app" >/dev/null 2>&1 && break
            sleep 1
          done
          docker cp scripts/scope_ui_smoke.py $NAME:/tmp/scope_ui_smoke.py
          docker exec -e SCOPE_FEATURES=all $NAME \
            sh -c "cd /app && DATA_DIR=/tmp/smoke PYTHONPATH=/app python /tmp/scope_ui_smoke.py"

      # promtool validates the observability stack's Prometheus config, the
      # alert rules, and the rule unit tests — via the same pinned image the
      # compose file deploys (config syntax is checked, series existence is
      # the python suite above).
      - name: promtool (observability config + rules + unit tests)
        run: bash scripts/ci_promtool.sh

      # The dashboard JSON is generated from scripts/build_dashboard.py.
      # This fails when the committed JSON drifts from the generator, so a
      # hand-edited panel is caught here instead of silently reverting the
      # next time someone rebuilds.
      - name: dashboard JSON is current (scripts/build_dashboard.py)
        run: python3 scripts/build_dashboard.py --check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # zizmor: nothing after checkout needs the token in .git/config.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Keyed on uv.lock (+ restore-keys fallback) by the action itself;
          # the hand-rolled actions/cache step had no restore-keys, so any
          # lockfile change was a cold cache every run.
          enable-cache: true

      - name: Sync dependencies (frozen lockfile, browser extra for the DUTs)
        run: uv sync --frozen --extra browser

      # The cache path MUST equal PLAYWRIGHT_BROWSERS_PATH below. Setting the
      # env var moves the install target, so caching the default
      # ~/.cache/ms-playwright saved a directory nothing ever wrote to.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pw-browsers
          key: pw-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      # Headless shell only — these suites never need a headed browser.
      # Same PLAYWRIGHT_BROWSERS_PATH as the run steps below: the browser must
      # land where the suites look for it.
      - name: Install Playwright chromium (headless shell)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: .venv/bin/playwright install --only-shell chromium

      # One gunicorn backs all of these; every suite asserts the listener is
      # its own server (require_own_server) before it tests anything.
      # test_route_panels seeds a fabricated SCOPE blob and asserts the four
      # data-gated panels render, so the server needs the features the blob
      # answers — without this its four gated routes 404 and "no sibling
      # panel leaked" passes on an empty page (the F6 hole).
      - name: Browser suites that need a server
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
          SCOPE_FEATURES: hourwise,academics,fees,placement,library,campus,profile,attendance,marks
        run: |
          bash scripts/ci_e2e_http.sh \
            test_sw test_xss test_navbar test_route_panels test_panel_api test_marks_dut test_personal \
            test_nav_routes \
            test_softrefresh_dut \
            test_touchfeel_dut \
            test_lowtier_dut \
            test_pull_dut \
            test_perf_budget_e2e \
            test_delete_dut \
            test_att_dut test_feedback_dut test_feedback_contrast test_login_guide_check \
            test_fees_dut test_scope_profile_dut \
            test_island_api

      - name: test_dash_fit (dashboard fit DUT, self-booting)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/e2e/test_dash_fit.py

      - name: test_dut_official_tt (official timetable DUT, self-booting)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: DATA_DIR="$(mktemp -d)" .venv/bin/python tests/e2e/test_dut_official_tt.py

      # The offline read path: online visit writes the cache, then the SAME
      # server is killed and the page must still paint. Boots its own server on
      # 18183 (nothing above holds that port), so it needs no fixture here.
      # The script exits non-zero when any leg fails, which is the whole point
      # of this step — a gate that cannot fail is worse than no gate.
      - name: Offline read path (scripts/offline_proof.sh)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: bash scripts/offline_proof.sh

      # Boots its own three gunicorn instances (18185 unconfigured /
      # 18186 push-enabled / 18187 same DB with push env stripped) and runs
      # test_push_sw + test_push_ui against them.
      - name: Push DUTs (test_push_sw + test_push_ui)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: VENV="$PWD/.venv" bash tests/e2e/run_push_duts.sh

      # W3.3 golden drift gate: re-capture the 9 routes and diff them against the
      # committed tests/golden/v3, naming every file that moved. It lives in THIS
      # job and not in unit, because it boots gunicorn and drives chromium — and
      # the browsers are already installed here. --no-screens is deliberate: the
      # goldens were captured on the laptop and PNG bytes encode the capture
      # host's font stack, so only dom/, api/, routes.json and metrics.json are
      # byte-comparable across hosts. Any difference exits non-zero.
      - name: Golden drift (tests/golden/v3 --check)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: bash scripts/capture_golden.sh --check --no-screens

      # dut_suite.sh (gates.sh's 10-script runner) deliberately has no step of
      # its own here: all 10 suites below already run in this job via
      # ci_e2e_http.sh, which is why dut_suite.sh exists for the LOCAL bar. This
      # step asserts that coverage instead of trusting a comment — if a DUT is
      # added to dut_suite.sh and not to the list above, CI goes red here rather
      # than the new script being silently untested on the runner forever.
      - name: dut_suite.sh coverage (every DUT is in this job)
        run: |
          set -eu
          WANT=$(grep -oE 'SCRIPTS="[^"]*"' scripts/dut_suite.sh \
                 | tr -d '"' | sed 's/^SCRIPTS=//')
          MISSING=""
          for s in $WANT; do
            grep -qE "\\b$s\\b" .github/workflows/tests.yml || MISSING="$MISSING $s"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::dut_suite.sh runs scripts this CI job does not:$MISSING"
            echo "Add them to the ci_e2e_http.sh step above, or CI never runs them."
            exit 1
          fi
          echo "dut_suite.sh's $(echo "$WANT" | wc -w) DUT scripts all run in this job"

      - name: Collect failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-logs
          path: |
            /tmp/suite-*.log
            /tmp/gunicorn-ci.log
            /tmp/gun-*.log
          if-no-files-found: ignore
          retention-days: 7

  # web/ — the Preact islands. Nothing else in this file touches TypeScript, so
  # before this job a type error or a broken island could merge with every
  # workflow green. Runs the same three gates the local build does, via one
  # script so the local repro is literally the CI line: bash scripts/ci_web.sh
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Node 22, not the lab's v26: 22 is the current Active LTS, GitHub caches
      # it on the runner image, and package.json declares no `engines` — so the
      # pin lives here rather than being implied by whichever image is default
      # (ubuntu-latest currently ships 20, which is what tsc 7 and vite 8 have
      # not been tested against). Bump together with the local pnpm.
      - name: Set up Node 22
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      # No secrets: pnpm install reads the public registry, tsc and vitest are
      # both offline once node_modules exists. No portal/CF/ntfy env is touched.
