# Grafana hardening for the OpenSRM observability stack. The compose file
# carries the env-level half (admin password from a secret file, anonymous
# off, users can't sign up); this file is the INI-level half: no phoning
# home, no update checks, no analytics.

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false
# only the admin account exists; nobody self-registers into the reader role

[security]
# cookies only over the ssh -L loopback path we expose
cookie_secure = false
# (plain HTTP on 127.0.0.1 — TLS terminates at the ssh tunnel, not here)

[paths]
# dashboards come from provisioning only; the UI cannot save over them
provisioning = /etc/grafana/provisioning
