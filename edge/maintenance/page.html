<!doctype html>
<html lang="en" data-theme="openSRM">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<meta name="robots" content="noindex">
<title>OpenSRM · Under maintenance</title>
<style>
  :root{
    --color-base-100: oklch(20% 0 0);
    --color-base-200: oklch(14% 0 0);
    --color-base-300: oklch(26% 0 0);
    --color-base-content: oklch(100% 0 0);
    --color-accent: oklch(100% 0 0);
    --color-accent-content: oklch(0% 0 0);
    --radius-box: 1rem;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--color-base-100); color:var(--color-base-content);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.5; overflow-x:hidden;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:40px 20px; -webkit-font-smoothing:antialiased;
  }

  /* ── blobatar wallpaper ───────────────────────────────────── */
  .bg{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .bg-blob{
    position:absolute; will-change:transform;
    translate:-50% -50%;
    animation:bob 9s ease-in-out infinite;
    animation-delay:var(--d,0s);
  }
  .bg-blob svg{ width:100%; height:100%; display:block }
  .field-m{ display:none }
  @media (max-width:640px){
    .field-d{ display:none }
    .field-m{ display:block }
    /* phone: soft scrim only — enough to lift the card off the colour, not enough to grey it out */
    .bg::after{
      background:radial-gradient(ellipse 78% 40% at 50% 50%,
        rgba(9,9,9,.94) 0%, rgba(9,9,9,.82) 42%, rgba(9,9,9,.34) 72%, rgba(9,9,9,.06) 100%);
    }
  }
  @keyframes bob{
    0%,100%{ translate:-50% -50%; }
    50%    { translate:-50% calc(-50% - 10px); }
  }
  /* dark vignette keeps the card the focal point */
  .bg::after{
    content:""; position:fixed; inset:0;
    background:radial-gradient(ellipse 62% 46% at 50% 50%,
      rgba(9,9,9,.96) 0%, rgba(9,9,9,.88) 34%, rgba(9,9,9,.46) 58%, rgba(9,9,9,.06) 82%, rgba(9,9,9,0) 100%);
  }

  .card{
    position:relative; z-index:2; width:100%; max-width:25rem;
    background:var(--color-base-200);
    border:1px solid var(--color-base-300);
    border-radius:var(--radius-box);
    padding:2.25rem 2rem 2rem; text-align:center;
    box-shadow:0 22px 70px -18px rgba(0,0,0,.98), 0 0 0 1px rgba(255,255,255,.045);
  }

  .logo{ display:block; width:min(196px,58%); height:auto; margin:0 auto 1.5rem; image-rendering:pixelated }

  h1{ font-size:1.3125rem; line-height:1.3; letter-spacing:-.015em; margin:0 0 .45rem; font-weight:650 }
  p{ margin:0 auto; max-width:22rem; color:color-mix(in oklab,var(--color-base-content) 62%,transparent) }

  button{
    margin-top:1.75rem; width:100%; padding:.7rem 1rem; min-height:44px;
    border-radius:var(--radius-box); border:1px solid var(--color-base-300);
    background:var(--color-accent); color:var(--color-accent-content);
    font:inherit; font-size:.9375rem; font-weight:600; cursor:pointer;
    transition:opacity .15s ease;
  }
  button:hover{ opacity:.88 }
  button:focus-visible{ outline:2px solid var(--color-accent); outline-offset:2px }
  button[disabled]{ opacity:.5; cursor:default }

  @media (max-width:640px){
    body{ padding:36px 34px }
  }
  @media (max-width:420px){
    body{ padding:32px 30px }
    .card{ padding:1.75rem 1.15rem 1.5rem }
    .logo{ width:min(160px,60%) }
    h1{ font-size:1.0625rem }
    p{ font-size:.9375rem }
  }
  @media (prefers-reduced-motion:reduce){ .bg-blob{ animation:none } }
</style>
</head>
