<!doctype html>
<html data-theme="openSRM">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OpenSRM">
<meta name="mobile-web-app-capable" content="yes">
<meta name="msapplication-TileColor" content="#111111">
<meta name="msapplication-TileImage" href="/static/icon-192.png">
<meta name="description" content="Self-hosted attendance dashboard for the SRM Student Portal.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="OpenSRM - Student Attendance Dashboard">
<meta property="og:description" content="Self-hosted attendance dashboard for the SRM Student Portal.">
<meta property="og:image" content="https://srm.200871.xyz/static/icon-512.png">
<meta property="og:url" content="https://srm.200871.xyz">
<meta property="og:site_name" content="OpenSRM">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="OpenSRM - Student Attendance Dashboard">
<meta name="twitter:description" content="Self-hosted attendance dashboard for the SRM Student Portal.">
<meta name="twitter:image" content="https://srm.200871.xyz/static/icon-512.png">
<title>OpenSRM</title>
{% include "partials/theme.html" %}</head>
<body class="bg-base-100 text-base-content min-h-[100dvh] flex flex-col">

  <!-- Main content -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md">

      <!-- Single card: logo + form -->
      <div class="card bg-base-200 border border-base-300">
        <figure>
          <img src="/static/logo-rect.png" alt="OpenSRM" width="400" height="120"
               class="w-full h-auto">
        </figure>
        <div class="card-body p-6 sm:p-8 pt-4 sm:pt-5">

          <!-- Form -->
          <form id="f" class="flex flex-col gap-5">

            <!-- Net ID field -->
            <fieldset class="fieldset">
              <label class="label pb-1" for="netid">
                <span class="fieldset-legend">NetID / Email</span>
              </label>
              <input type="text" id="netid" name="netid" placeholder="NetID / SRM email id"
                     required autocomplete="username" autocapitalize="off" autocorrect="off" maxlength="50"
                     class="input w-full">
            </fieldset>

            <!-- Password field -->
            <fieldset class="fieldset">
              <label class="label pb-1" for="pw">
                <span class="fieldset-legend">Password</span>
              </label>
              <div class="relative">
                <input type="password" id="pw" name="password" placeholder="Password"
                       required autocomplete="current-password" maxlength="128"
                       class="input w-full pr-12">
                <button type="button" id="pw-toggle"
                        class="absolute right-1 top-1/2 -translate-y-1/2 btn btn-ghost btn-sm btn-square"
                        aria-label="Toggle password visibility">
                  <svg id="pw-eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                       stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                  </svg>
                  <svg id="pw-eye-closed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                       stroke-width="1.5" stroke="currentColor" class="w-5 h-5 hidden">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/>
                  </svg>
                </button>
              </div>
            </fieldset>

            <!-- Submit button -->
            <button type="submit" id="b" class="btn btn-accent btn-lg w-full mt-1">
              <span class="loading loading-spinner loading-sm hidden" id="loginSpinner"></span>
              <span id="btnLabel">Sign in</span>
            </button>

          </form>

          <!-- Status message -->
          <div id="status" role="alert" aria-live="polite"
               class="text-center text-sm min-h-5 mt-2"></div>

        </div>
      </div>

      <!-- Footer info -->
      <p class="text-center text-xs text-base-content/50 mt-6 leading-relaxed px-4">
        Securely logs into the SRM student portal and syncs your attendance data.
        <br>First login takes about 15 seconds.
      </p>

    </div>
  </main>

  <!-- Safe area padding for iOS -->
  <div class="h-[env(safe-area-inset-bottom)]"></div>

  <script src="/static/login.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/static/sw.js", {scope: "/"}).catch(function(){});
    }
  </script>
</body>
</html>
