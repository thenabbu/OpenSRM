<!-- Widget: profile — box only, no label (identity is its own label) -->
<div class="wbox rounded-box p-4">
  <div class="flex items-center gap-3 min-w-0">
    <div class="avatar shrink-0">
      <div class="bg-base-300 w-16 h-16 rounded-full overflow-hidden blobatar-gaze">
        {% if profile_photo %}
        <!-- scope/portal photo (validated data: URI in app/views/profile.py);
             the blobatar SVG below stays the fallback for empty/invalid -->
        <img src="{{ profile_photo }}" alt="" width="64" height="64"
             class="w-full h-full object-cover">
        {% else %}
        {{ netid | blobatar(size=64, animate="always") | safe }}
        {% endif %}
      </div>
    </div>
    <div class="min-w-0 flex-1">
      <div class="text-sm font-semibold truncate">{{ student_name or netid }}</div>
      <button type="button" id="copyEmail" data-email="{{ dash.email }}"
              class="btn btn-ghost btn-xs px-0 min-h-6 font-mono text-base-content/70 gap-1"
              title="Click to copy email">
        <span class="truncate">{{ dash.email }}</span>
        <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
        </svg>
      </button>
      {% if dash.reg_no %}
      <div class="text-xs text-base-content/50 font-mono cursor-copy" data-copy="{{ dash.reg_no }}" title="Click to copy">{{ dash.reg_no }}</div>
      {% endif %}
      {% if dash.oneliner %}
      <div class="text-xs text-base-content/60 truncate" title="{{ dash.oneliner }}">{{ dash.oneliner }}</div>
      {% endif %}
    </div>
  </div>
</div>
