  --color-secondary: oklch(65% 0.241 354.308); --color-secondary-content: oklch(97% 0.014 343.198);
  --color-accent: oklch(100% 0 0); --color-accent-content: oklch(0% 0 0);
  --color-neutral: oklch(26% 0 0); --color-neutral-content: oklch(98% 0 0);
  --color-info: oklch(58% 0.158 241.966); --color-info-content: oklch(97% 0.013 236.62);
  --color-success: oklch(76% 0.177 163.223); --color-success-content: oklch(98% 0.014 180.72);
  --color-warning: oklch(68% 0.162 75.834); --color-warning-content: oklch(98% 0.026 102.212);
  --color-error: oklch(57% 0.245 27.325); --color-error-content: oklch(97% 0.013 17.38);
  --radius-selector: 0.5rem; --radius-field: 0.5rem; --radius-box: 0.5rem;
  --size-selector: 0.25rem; --size-field: 0.25rem; --border: 1px; --depth: 1; --noise: 0;
  color-scheme: dark;
}
/* Selected navbar tab — two cues on purpose. The tint is the subtle background
   the bar needs; the 2px currentColor bar is the non-color state signal
   (WCAG 1.4.1 — same bar the mobile dock's .dock-active draws). daisyUI's own
   .btn-active fills base-200 with 5% black = #090909, byte-identical to this
   bar, so it could never show (DESIGN §10.11). Tint = 1.25:1 vs the navbar
   (the base-300 over base-200 step, §2.3); bar = 19.9:1. */
.navbar [role="tab"][aria-selected="true"] {
  position: relative;
  background-color: color-mix(in oklab, var(--color-base-content) 10%, transparent);
}
.navbar [role="tab"][aria-selected="true"]::after {
  content: "";
  position: absolute;
  width: auto;          /* daisyUI .dock-active:after sets width:2.5rem and dash.js
                           toggles that class on every [data-tab] — without this the
                           bar renders 40px (left 8 / right 41) instead of the
                           left/right-derived width. Measured: 73px in, 40px leaked. */
  left: 0.5rem;
  right: 0.5rem;
  bottom: 2px;
  height: 2px;
  background: currentColor;
}
/* Scroll affordance (v1.32.0): a thin, self-hiding overlay bar on desktop only.
   NOT scrollbar-gutter:stable — that reserved a 15px dead strip on every page
   (on phones too, where there is no scrollbar at all) and pushed the navbar's
   right edge off the viewport edge. The bar is drawn OVER the content, so it
   costs no layout width and the layout never moves when it appears.
   Chromium/Safari: width 0 until the page is hovered or scrolled, then a 6px
   rounded thumb at 35% white. Firefox has no hover state for ::-webkit-*, so
   it gets the standard props: thin + a faint thumb, same colour.
   Touch platforms never scroll with a visible bar -> hidden outright. */
@media (hover: hover) and (pointer: fine) {
  html { scrollbar-width: thin;
         scrollbar-color: color-mix(in oklab, var(--color-base-content) 35%, transparent) transparent; }
}
@media (hover: none), (pointer: coarse) {
  html { scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
}
@supports selector(::-webkit-scrollbar) {
  @media (hover: hover) and (pointer: fine) {
    html { scrollbar-width: auto; scrollbar-color: auto; }
    /* width 0 keeps it out of the way; the hover/scroll state below gives it
       its 6px back. Track is always transparent — no gutter, no strip. */
    html::-webkit-scrollbar { width: 0; height: 0; }
    html::-webkit-scrollbar-track,
    html::-webkit-scrollbar-corner { background: transparent; }
    html::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 9999px;
      transition: background-color 200ms ease-out;
    }
    html:hover::-webkit-scrollbar,
    html.is-scrolling::-webkit-scrollbar { width: 6px; height: 6px; }
    html:hover::-webkit-scrollbar-thumb,
    html.is-scrolling::-webkit-scrollbar-thumb {
      background: color-mix(in oklab, var(--color-base-content) 35%, transparent);
    }
    html::-webkit-scrollbar-thumb:hover {
      background: color-mix(in oklab, var(--color-base-content) 55%, transparent);
    }
  }
}
/* First paint is dark even before app.css parses — no color jump
   (the data-theme block above paints the tokens this matches). */
html { background: oklch(20% 0 0); }
