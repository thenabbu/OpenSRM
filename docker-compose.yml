services:
  opensrm:
    # OPENSRM_TAG pins the deployed image tag; unset = latest (the only tag
    # CI published before this change, so the default render is byte-identical).
    # Rollback: set OPENSRM_TAG=<version> in /docker/opensrm/.env (NOT the
    # master /docker/.env - compose interpolates from the project env file,
    # the /docker/opensrm/.env next to this compose file), then
    #   docker compose pull && docker compose up -d opensrm
    image: ghcr.io/thenabbu/opensrm:${OPENSRM_TAG:-latest}
    container_name: opensrm
    restart: unless-stopped
    # audit 2026-09-27: stop publishing on ALL interfaces. Access is via the
    # Cloudflare tunnel; the origin was moved to this host's cloudflared
    # gateway (172.31.0.1, tunnel config v27) precisely so the bind can drop
    # 0.0.0.0 — LAN hosts (192.168.29.x) can no longer bypass the CF front
    # end. Verified no LAN consumer: Uptime Kuma has no 8083 monitor, no
    # hermes script references it, srm-sp-auto (stale) is not running.
    # ponytail: 172.31.0.1 = cloudflared_default bridge gateway — if the
    # tunnel 502s after docker recreates that network, re-check the gateway IP.
    ports:
      - "127.0.0.1:8083:8080"
      - "172.31.0.1:8083:8080"
    volumes:
      - opensrm-data:/app/data
    # Container hardening (non-root runtime; entrypoint.sh starts root only
    # to chown this volume, then drops to opensrm uid 10001).
    # read_only: the rootfs is immutable. Everything the process writes lives
    # on the volume below or on the /tmp tmpfs below that: gunicorn's arbiter
    # control socket + worker heartbeat, the Playwright driver and Chromium's
    # user-data-dir all land in /tmp. Measured on the built image: idle
    # 227,084 kB RSS (gunicorn master 30,236 + worker 196,848), peak
    # 636 MiB cgroup while a Playwright fallback had Chromium open — so the
    # limits below are ~2.4x the observed peak and ~2x the observed task
    # count, headroom for a heavier portal page rather than a tight ceiling.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    # cap_drop ALL leaves nothing; the entrypoint needs exactly three back:
    # CHOWN (chown -R /app/data), SETUID+SETGID (setpriv drops to opensrm).
    # The dropped app runs with CapPrm/CapEff = 0 (proved from /proc/1/status).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    pids_limit: 160
    environment:
      - TZ=Asia/Kolkata
      # sqlite: delete (default, today's mode) or wal — see README Configuration
      - SQLITE_JOURNAL_MODE=${SQLITE_JOURNAL_MODE:-delete}
      # audit 2026-10-07: compose default DEBUG overrode the Dockerfile INFO —
      # prod ran DEBUG for 15 days (3,366 junk DEBUG lines). Default INFO now;
      # set LOG_LEVEL=DEBUG in /docker/opensrm/.env (the project env file —
      # compose interpolates only from it, never the master /docker/.env).
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # sync cache window (README): a refresh answered from the last sync
      # within this many seconds never contacts the portal; 0 disables.
      # Default matches the code's data-derived 300s.
      - SYNC_MIN_INTERVAL_S=${SYNC_MIN_INTERVAL_S:-300}
      - SRM_EGRESS_URL=${SRM_EGRESS_URL:-}
      - SRM_PROXY_TOKEN=${SRM_PROXY_TOKEN:-}
      # Error alerting (docs/runbook.md, README logging section): set
      # NTFY_ALERT_URL in /docker/opensrm/.env (project env file) to push
      # ERROR-level (5xx/unhandled — not WARNING) opensrm log lines to an
      # ntfy topic, rate-limited 1/min (app/logging_setup.py NtfyHandler).
      - NTFY_ALERT_URL=${NTFY_ALERT_URL:-}
      # audit run-1 #18: edge provenance secret — set in /docker/opensrm/.env
      # AND inject the same value as X-Edge-Secret from the tunnel config
      # (cloudflared originRequest.httpHeaders), together or not at all.
      - CF_EDGE_SECRET=${CF_EDGE_SECRET:-}
      # Web Push (docs/push.md): feature stays OFF until PUSH_ENABLED=1 in
      # /docker/opensrm/.env; missing VAPID keys -> status endpoint says
      # "not configured".
      - PUSH_ENABLED=${PUSH_ENABLED:-0}
      - PUSH_DRY_RUN=${PUSH_DRY_RUN:-0}
      - PUSH_ALLOW_NETIDS=${PUSH_ALLOW_NETIDS:-}
      - PUSH_TICK_SECRET=${PUSH_TICK_SECRET:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      # Key rotation (SECURITY.md "Key rotation"): comma-separated Fernet
      # keys, FIRST encrypts, every key decrypts. Set it in
      # /docker/opensrm/.env (this project's compose env) - NOT /docker/.env.
      # Unset/empty -> DATA_DIR/fernet.key, exactly today's behaviour.
      - FERNET_KEYS=${FERNET_KEYS:-}
    # healthcheck + log rotation: SECURITY.md documents both; the live lab
    # compose already had them — this repo copy had drifted from live.
    # GET /healthz = SELECT 1, no session, no portal contact (app/app.py).
    # The probe runs under the same runtime user as the app (setpriv drops
    # the short-lived exec process too, so nothing in the container runs as
    # root), and its request line is demoted to DEBUG in _log_request — a
    # 30s poll cannot fill opensrm.log the way the old GET / probe did.
    healthcheck:
      test:
        - CMD
        - setpriv
        - --reuid=10001
        - --regid=10001
        - --init-groups
        - --
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  opensrm-data:
