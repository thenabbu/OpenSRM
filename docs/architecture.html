      <title id="arch-title">OpenSRM data flow — portal and SCOPE into one store</title>
      <desc id="arch-desc">Your browser reaches the OpenSRM container through the Cloudflare edge. Inside it, Flask routes hand work to two independent sources: the portal pipeline, which fetches the SRM student portal directly or through the optional egress proxy, and the SCOPE client, which calls the SOAP backend behind SRM's mobile app. Both feed the parsers, everything is written through one data-access layer into the SQLite store, and the routes render pages from that store.</desc>
